<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap");
:root{color-scheme:light dark;--bg:#efeaf9;--card:#fff;--ink:#241b3a;--mute:#7b7592;--line:#e8e3f3;--ac:#4b2a85;--lav:#f1ecfb;--on:#fff;--ok:#12805c;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#171226;--card:#211a36;--ink:#efeafc;--mute:#a69fc0;--line:#352c52;--ac:#b9a3ff;--lav:#2b2347;--on:#1a0f3a;--ok:#5fd6a6;--er:#ff9a92}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 14px calc(28px + env(safe-area-inset-bottom,0px))}
.inv{max-width:560px;margin:18px auto 0;background:var(--card);border-radius:28px;border-top:6px solid var(--ac);padding:26px 22px;box-shadow:0 10px 30px rgba(75,42,133,.10)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{margin:0;font-size:1.55rem;font-weight:800;color:var(--ac);line-height:1.15}.tag{font-weight:800;letter-spacing:3px;font-size:.95rem}.mute{color:var(--mute);font-size:.86rem}
.cap{font-size:.72rem;font-weight:700;letter-spacing:1.6px;color:var(--mute);text-transform:uppercase}
.to{margin:22px 0 18px}.to b{display:block;font-size:1.05rem;margin-top:3px}
.hd{display:flex;justify-content:space-between;border-bottom:1.5px solid var(--line);padding-bottom:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0}
.row img,.row .ph{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(--lav);display:grid;place-items:center;flex:none;font-size:1.4rem}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:700}.amt{font-weight:800;white-space:nowrap}
hr{border:0;border-top:1.5px solid var(--line);margin:6px 0 10px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .t{align-items:center;font-weight:800;font-size:1.05rem;padding:6px 0 2px}.sum .t span:last-child{font-size:1.6rem;color:var(--ac)}
.pay{margin-top:16px;background:var(--lav);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.pay b{display:block}
.st{padding:5px 14px;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:.5px}.paid{background:rgba(18,128,92,.16);color:var(--ok)}.unpaid{background:rgba(179,38,30,.13);color:var(--er)}
.thx{text-align:center;margin-top:20px}.thx b{display:block;font-weight:700}
.cancel{margin:0 0 16px;border:2px solid var(--er);border-radius:16px;padding:10px 14px;text-align:center;color:var(--er)}.cancel b{display:block;font-size:1.5rem;letter-spacing:3px}
.foot{max-width:560px;margin:14px auto 0;display:flex;gap:10px;flex-wrap:wrap}.foot p{flex-basis:100%;text-align:center;margin:0}
button{flex:1;font:inherit;font-weight:800;border:2px solid var(--ac);border-radius:16px;padding:13px 18px;background:var(--ac);color:var(--on);cursor:pointer}
button.g{background:var(--card);color:var(--ac);border-color:var(--line)}
.err{text-align:center;padding:60px 0}
@media print{body{background:#fff;color:#000;padding:0}.inv{box-shadow:none;margin:0;max-width:none}.noprint{display:none}}
</style>
</head>
<body>
<div class="inv" id="inv"><p class="err mute">Loading invoice…</p></div>
<div class="foot noprint" id="foot"></div>
<script>
const [, , slug, number] = location.pathname.split("/");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = n => "₹" + Math.round(n * 100 / 100).toLocaleString("en-IN");
fetch(`/api/invoice/${encodeURIComponent(slug)}/${encodeURIComponent(number)}${location.search}`).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  document.title = "Invoice " + d.number + " – " + d.store;
  const canc = d.status === "Cancelled", cdate = d.cancelledAt ? new Date(d.cancelledAt).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" }) : "";
  const when = d.date ? new Date(d.date).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" }) : "";
  const kinds = [...new Set(d.methods)].join(", "), contact = [d.business.phone ? "WhatsApp " + d.business.phone : "", d.business.email].filter(Boolean).join(" · ");
  const row = (k, v, c) => `<div class="mute"${c ? ` style="color:${c}"` : ""}><span>${k}</span><span>${v}</span></div>`;
  $("inv").innerHTML = `${canc ? `<div class="cancel"><b>CANCELLED</b>${cdate ? "<span>on " + cdate + "</span>" : ""}</div>` : ""}
  <div class="top"><div><h1>${esc(d.store)}</h1><div class="mute">${esc(d.business.address)}${d.business.gstin ? "<br>GSTIN " + esc(d.business.gstin) : ""}</div></div><div style="text-align:right"><div class="tag">${d.gst > 0 && d.business.gstin ? "TAX INVOICE" : "INVOICE"}</div><div class="mute">INV-${esc(String(d.number).replace("ORD-", ""))}<br>${when}</div></div></div>
  <div class="to"><div class="cap">Billed to</div><b>${esc(d.name || "Customer")}</b><div class="mute">${esc([d.phone, d.address].filter(Boolean).join(" · "))}</div></div>
  <div class="hd cap"><span>Item</span><span>Amount</span></div>
  ${d.lines.map(l => `<div class="row">${l.photo ? `<img src="${esc(l.photo)}" alt="">` : '<div class="ph">📦</div>'}<div class="nm"><b>${esc(l.name)}</b><span class="mute">${l.qty} × ${inr(l.price)}</span></div><div class="amt">${inr(l.amount)}</div></div>`).join("")}
  <hr><div class="sum">${row("Subtotal", inr(d.subtotal))}${d.discount > 0 ? row("Discount", "−" + inr(d.discount)) : ""}${d.gst > 0 ? row("GST " + d.gstRate + "%", inr(d.gst)) : ""}${row("Packaging", inr(d.packing))}${row("Delivery", inr(d.delivery))}<hr><div class="t"><span>Total</span><span>${inr(d.total)}</span></div>${d.gst > 0 ? "" : '<div class="mute" style="display:block">Prices include GST</div>'}</div>
  ${canc ? `<div class="pay"><div><b>Cancelled</b><span class="mute">${d.refundDue > 0 ? "Refund due " + inr(d.refundDue) : d.refunded > 0 ? "Refunded " + inr(d.refunded) : "Nothing to pay"}</span></div></div>` : `<div class="pay"><div><b>${d.due <= 0 ? "Paid" + (kinds ? " via " + esc(kinds) : "") : "Payment pending"}</b><span class="mute">Balance due ${inr(d.due)}</span></div><span class="st ${d.due <= 0 ? "paid" : "unpaid"}">${d.due <= 0 ? "PAID" : "PENDING"}</span></div>`}
  ${d.notes ? `<p class="mute" style="margin:12px 0 0">Note: ${esc(d.notes)}</p>` : ""}
  <div class="thx mute"><b>Thank you for shopping with us</b>${esc(contact)}</div>`;
  $("foot").innerHTML = `<button onclick="shareInv()">Share</button><button class="g" onclick="downloadInv()">Download PDF</button><p class="mute" id="invmsg"></p>`;
}).catch(() => { $("inv").innerHTML = '<p class="err">This invoice link is not valid.<br><span class="mute">Please ask the shop to send it again.</span></p>'; });
const pdfUrl = dl => `/api/invoice/${encodeURIComponent(slug)}/${encodeURIComponent(number)}/pdf${location.search}${location.search ? "&" : "?"}dl=${dl}`;
const say = t => { const m = $("invmsg"); if (m) m.textContent = t; };
// Download: the server sends a real PDF file, so it works on iPhone, Android and computers (no print dialog needed)
function downloadInv() { say("Preparing your PDF…"); location.href = pdfUrl(1); setTimeout(() => say(""), 4000); }
// Share: sends the PDF itself where the phone allows it, otherwise the invoice link
async function shareInv() {
  const title = document.title, link = location.href;
  try {
    const r = await fetch(pdfUrl(0)); const f = new File([await r.blob()], "Invoice-" + number + ".pdf", { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { if (navigator.share) { await navigator.share({ title, url: link }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(link); say("Link copied. You can paste it in any chat."); } catch (e) { prompt("Copy this invoice link:", link); }
}
function $(id) { return document.getElementById(id); }
</script>
</body>
</html>
