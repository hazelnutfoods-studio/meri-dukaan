}

dialog.pop{width:min(460px,92vw);height:75vh;max-height:75vh;padding:0;overflow:hidden}
dialog.pop[open]{display:flex;flex-direction:column}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}.pop-h h2{margin:0;font-size:1.05rem;min-width:0}.pop-b{padding:6px 16px 16px;overflow:auto;flex:1;min-height:0}
.vall{background:none;border:0;padding:8px 0 2px;color:#7c3aed;font-weight:650;cursor:pointer;display:block;font-size:.88rem}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .vall{color:#b79cff}}:root[data-theme="dark"] .vall{color:#b79cff}
.imp td,.imp th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:.82rem;vertical-align:top}.imp{width:100%;border-collapse:collapse}
/* smooth motion: short and quiet, off for people who ask for less motion */
:where(button,.pr,.pc,.at,.cr,.circ,.btn,.oi){transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease}
:where(button,.pr,.pc,.at,.cr,.btn,.oi):active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
#view.fade{animation:fadeIn .16s ease both}
dialog[open]{animation:popIn .2s ease}dialog[open]::backdrop{animation:fadeIn .22s ease both}
dialog.closing{opacity:0;transform:translateY(16px);transition:transform .2s ease,opacity .2s ease}dialog.closing::backdrop{opacity:0;transition:opacity .2s ease}
@media(max-width:800px){dialog[open]{animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}dialog.pop[open]{animation:popIn .2s ease}dialog.closing{transform:translateY(100%)}dialog.pop.closing{transform:scale(.97);opacity:0}}
[data-gl]{position:relative}[data-gl]>button{position:relative;z-index:1;background:transparent!important;box-shadow:none!important}
[data-gl]>.gl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;border-radius:10px;background:var(--soft)}

  trend: '<path d="m3 17 6-6 4 4 8-8M15 7h6v6"/>', ext: '<path d="M14 4h6v6M10 14 20 4M18 14v6H4V6h6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', out: '<path d="M10 4H5v16h5M16 8l4 4-4 4M20 12H9"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>', key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/>',
  pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6m0 0-2.5-2.5M12 17l2.5-2.5"/>',

  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', hourglass: '<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>',
};
const ic = (n, s) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"${s ? ` style="width:${s}px;height:${s}px"` : ""} aria-hidden="true">${IC[n] || ""}</svg>`;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const CFG = window.__CFG || (() => { // remembered from last time so the page opens at once; checked again in the background
  try { const c = JSON.parse(localStorage.getItem("cfg") || "null"); if (c && c.slug) { fetch("/api/config").then(r => r.json()).then(j => { if (j.slug && j.slug !== c.slug) { localStorage.setItem("cfg", JSON.stringify(j)); location.reload(); } }).catch(() => {}); return c; } } catch (e) {}
  try { const x = new XMLHttpRequest(); x.open("GET", "/api/config", false); x.send(); const j = JSON.parse(x.responseText) || {}; try { if (j.slug) localStorage.setItem("cfg", JSON.stringify(j)); } catch (e) {} return j; } catch (e) { return {}; }
})();
const slug = CFG.slug || "";
const base = "/api/manage/" + slug;
const SK = "login:" + slug; // remembered on this device, one entry per store
const saved = (() => { try { return JSON.parse(localStorage.getItem(SK) || "{}"); } catch (e) { return {}; } })();
let SN = "Your store", key = saved.key || sessionStorage.getItem("k") || "", tok = saved.tok || "", ME = { role: "owner", perms: {}, profile: {}, business: {} };
let SL = null, ivTab = "stock", ivf = "all", ivq = "", invf = "all", invq = "", PU = [], invKind = "sales", invsKind = "sales", puq = "", PIN = null, lastKey = "";
let BR = [], P = [], O = [], S = [], T = [], U = [], DR = [], tab = "dash", lastTab = "dash", range = "30", flt = "all", orderTab = "inprocess", orderDrafts = {};
let pq = "", pcat = "All", pfil = "all", oq = "", showOq = false, INV = null;
const owner = () => ME.role == "owner";
const can = p => owner() || !!(ME.perms && ME.perms[p]);
const PL = { add: "Add products and edit name, photos, supplier", stock: "Edit quantity and expiry", cost: "Edit purchase price", tags: "Assign tags to products", orders: "View and update orders" };

async function api(p, method, body) {
  const r = await fetch(p, { method: method || "GET", headers: { "x-key": key, "x-token": tok, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}
// Orders and purchases arrive a page at a time (newest first, plus every order still open). Home's numbers come from SUM, which is exact however many orders there are.
let SUM = null, OMORE = false, OCUR = null, PUMORE = false, PUCUR = null, OFULL = {};
const byNew = (a, b) => new Date(b.createdAt) - new Date(a.createdAt);
const mergeO = list => { const m = new Map(O.map(o => [o.number, o])); list.forEach(o => m.set(o.number, o)); O = [...m.values()].sort(byNew); };
async function load() {
  SL = null; OFULL = {};
  const [p, s, t, o, u, d, pu, sm, bn] = await Promise.all([api(base + "/products"), api(base + "/suppliers"), api(base + "/tags"), can("orders") ? api(base + "/orders") : { orders: [] }, owner() ? api(base + "/users") : [], owner() ? api(base + "/drafts") : [], owner() ? api(base + "/purchases") : { purchases: [] }, can("orders") ? api(base + "/summary").catch(() => null) : null, api(base + "/brands").catch(() => [])]);
  BR = bn; P = p; S = s; T = t; U = u; DR = d; SUM = sm;
  O = o.orders; OMORE = !!o.more; OCUR = o.cursor || null; PU = pu.purchases; PUMORE = !!pu.more; PUCUR = pu.cursor || null;
}
async function loadMoreOrders(btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Loading…"; }
  try { const r = await api(base + "/orders?before=" + encodeURIComponent(OCUR)); mergeO(r.orders); OMORE = !!r.more; OCUR = r.cursor || null; } catch (e) { alert(e.message); }
  draw();
}
async function loadMorePu(btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Loading…"; }
  try { const r = await api(base + "/purchases?before=" + encodeURIComponent(PUCUR)); const m = new Map(PU.map(x => [x.number, x])); r.purchases.forEach(x => m.set(x.number, x)); PU = [...m.values()].sort(byNew); PUMORE = !!r.more; PUCUR = r.cursor || null; } catch (e) { alert(e.message); }
  draw();
}
async function searchOld(btn) { // looks through every order in the shop (reads them all once)
  const q = (tab == "invs" ? invq : oq).trim(); if (!q) return;
  if (btn) { btn.disabled = true; btn.textContent = "Searching…"; }
  try { mergeO((await api(base + "/orders?q=" + encodeURIComponent(q))).orders); OFULL["q:" + q.toLowerCase()] = 1; } catch (e) { alert(e.message); }
  draw();
}
async function ensureUnpaid() { // the Unpaid views need every unpaid order, old ones too
  if (OFULL.unpaid || !OMORE) return;
  try { mergeO((await api(base + "/orders?unpaid=1")).orders); OFULL.unpaid = 1; draw(); } catch (e) { alert(e.message); }
}
const moreFoot = q => {
  q = (q || "").trim();
  if (!OMORE) return "";
  return `<div class="row" style="justify-content:center;gap:8px;margin:12px 0 4px;flex-wrap:wrap"><button class="btn g sm" onclick="loadMoreOrders(this)">Load older orders</button>${q.length >= 2 && !OFULL["q:" + q.toLowerCase()] ? `<button class="btn g sm" onclick="searchOld(this)">Search every order for “${esc(q)}”</button>` : ""}</div>`;
};
async function start() {
  ME = await api(base + "/me"); await load();
  if (owner() && ME.business) SN = ME.business.name || SN;
  try { localStorage.setItem(SK, JSON.stringify({ key, tok })); } catch (e) {}
  $("login").hidden = true; $("app").hidden = false; if (tab == "ord" && !can("orders")) tab = "dash"; draw();
  if (!owner()) fetch("/api/store/" + slug).then(r => r.json()).then(d => { SN = d.name; draw(); }).catch(() => {});
  document.title = SN + " – manage";
}
async function login() {
  const user = $("user").value.trim().toLowerCase(), pw = $("key").value;
  try {
    if (user) {
      const r = await fetch(base + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user, password: pw }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Could not log in");
      tok = j.token; key = "";
    } else { if (pw) key = pw; tok = ""; }
    await start();
  } catch (e) {
    key = ""; tok = "";
    $("err").textContent = !user && /log in again/i.test(e.message) ? "That password or store key doesn’t match this store. Staff: please type your username too." : e.message;
  }
}
if (!slug) document.body.innerHTML = '<p style="padding:20px">Could not reach the shop. Please reload.</p>';
else if (key || tok) start().catch(() => { try { localStorage.removeItem(SK); } catch (e) {} key = ""; tok = ""; $("err").textContent = "Please log in again."; });
const act = async f => { try { await f(); await load(); } catch (e) { alert(e.message); } draw(); };
const theme = () => { try { const t = localStorage.getItem("theme"); return t == "light" || t == "dark" ? t : "auto"; } catch (e) { return "auto"; } };
function setTheme(v) { try { v == "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", v); } catch (e) {} if (v == "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); draw(); }
const logout = () => { try { localStorage.removeItem(SK); } catch (e) {} sessionStorage.clear(); location.reload(); };
const REDUCED = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
const lowScreen = () => { try { return matchMedia("(max-width:800px)").matches; } catch (e) { return false; } };
function reset(d) { clearTimeout(d._t); d.classList.remove("closing"); d.style.transform = ""; d.style.transition = ""; }
const modal = html => { const d = $("dlg"); reset(d); d.innerHTML = '<div class="grab"><div class="handle"></div></div>' + html; if (!d.open) d.showModal(); glide(); };
function shut(d) { if (!d.open) return; if (REDUCED()) return d.close(); d.classList.add("closing"); clearTimeout(d._t); d._t = setTimeout(() => d.close(), 200); }
const closeM = () => shut($("dlg"));
const popup = (title, html) => { const d = $("dlg2"); reset(d); d.innerHTML = `<div class="pop-h"><h2>${title}</h2><button class="circ" onclick="closePop()" aria-label="Close">${ic("x")}</button></div><div class="pop-b">${html}</div>`; if (!d.open) d.showModal(); };
const closePop = () => shut($("dlg2"));
$("dlg").addEventListener("close", () => { reset($("dlg")); if (!$("app").hidden && tab == "ord") draw(); }); // puts a dropdown back if a dialog was cancelled

// drag the handle (or the strip around it) down to close a bottom sheet; tap outside any sheet to close it
(function () {
  const d = $("dlg"); let drag = false, sy = 0, st = 0, dy = 0;
  d.addEventListener("pointerdown", e => { if (!e.target.closest || !e.target.closest(".grab") || !lowScreen()) return; drag = true; sy = e.clientY; st = e.timeStamp; dy = 0; d.style.transition = "none"; try { e.target.closest(".grab").setPointerCapture(e.pointerId); } catch (x) {} });
  d.addEventListener("pointermove", e => { if (!drag) return; dy = Math.max(0, e.clientY - sy); d.style.transform = "translateY(" + dy + "px)"; });
  const end = e => {
    if (!drag) return; drag = false;
    const h = d.getBoundingClientRect().height || 400, v = dy / Math.max(1, e.timeStamp - st);
    d.style.transition = "transform .2s ease";
    if (dy > h / 3 || (v > 0.6 && dy > 24)) { d.style.transform = "translateY(100%)"; clearTimeout(d._t); d._t = setTimeout(() => d.close(), 200); }
    else { d.style.transform = ""; setTimeout(() => { if (d.open) d.style.transition = ""; }, 230); }
  };
  d.addEventListener("pointerup", end); d.addEventListener("pointercancel", end);
  [d, $("dlg2")].forEach(x => {
    let downOut = false;
    const out = e => { const r = x.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
    x.addEventListener("pointerdown", e => { downOut = out(e); });
    x.addEventListener("click", e => { if (downOut && out(e)) shut(x); downOut = false; });
  });
})();
// the little pill behind the active tab slides to the new tab instead of jumping
const GL = {};
function glide() {
  document.querySelectorAll("[data-gl]").forEach(c => {
    const kids = [...c.children], on = kids.find(k => k.tagName == "BUTTON" && k.classList.contains("on")); if (!on) return;
    let g = kids.find(k => k.classList.contains("gl")); if (!g) { g = document.createElement("i"); g.className = "gl"; c.prepend(g); }
    const cr = c.getBoundingClientRect(), br = on.getBoundingClientRect(), to = { x: br.left - cr.left - c.clientLeft, y: br.top - cr.top - c.clientTop, w: br.width, h: br.height }, k = c.dataset.gl, from = GL[k];
    const put = p => { g.style.width = p.w + "px"; g.style.height = p.h + "px"; g.style.transform = "translate(" + p.x + "px," + p.y + "px)"; };
    GL[k] = to;
    if (from && !REDUCED() && (from.x !== to.x || from.w !== to.w)) { g.style.transition = "none"; put(from); g.getBoundingClientRect(); g.style.transition = "transform .22s ease,width .22s ease"; }
    put(to);
  });
}

// new orders appear without reloading: check every 30 seconds
setInterval(async () => {
  if (document.hidden || $("app").hidden || !can("orders")) return;
  try {
    const r = await api(base + "/orders"), un = a => a.filter(o => o.seen === false).length, was = O.length, wasUn = un(O), sig = JSON.stringify(O.map(o => [o.number, o.status]));
    mergeO(r.orders); const changed = O.length != was || un(O) != wasUn || sig != JSON.stringify(O.map(o => [o.number, o.status]));
    if (changed) { SUM = await api(base + "/summary").catch(() => SUM); $("dlg").open ? drawNav() : draw(); }
  } catch (e) {}
}, 30000);

// ----- money and status helpers -----
const DL = { New: "New", Packed: "To dispatch", "In transit": "In transit", Delivered: "Delivered", Cancelled: "Cancelled" };
const DB = { New: "wn", Packed: "wn", "In transit": "in", Delivered: "ok", Cancelled: "nt" };
const PB = { Paid: "ok", Partial: "wn", Pending: "nt", Overdue: "er", Cancelled: "nt" };
const age = o => (Date.now() - new Date(o.createdAt)) / 864e5;

function shrinkAvatar(file) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const S = 480, c = document.createElement("canvas"); c.width = S; c.height = S;
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = Math.max(S / iw, S / ih), w = iw * k, h = ih * k, x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, S, S); x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => no(new Error("Could not read that photo.")); img.src = u;
  });
}

function openPuDelete(n) {
  const p = PU.find(x => x.number == n); if (!p) return;
  modal(`<h2 style="font-size:1.2rem">Delete ${esc(p.number)}?</h2><div class="card" style="margin:10px 0"><b>${esc(p.supplier)}</b><div class="mute">${inr(p.total)} · ${p.lines.length} item${p.lines.length == 1 ? "" : "s"} · ${puDate(p)}</div></div>
  <p class="mute">This removes the purchase from your lists and totals. You can’t undo it. What should happen to the stock it added?</p>
  <div style="display:grid;gap:10px"><button class="btn wide" style="background:var(--er);color:#fff" onclick="doPuDelete('${esc(n)}',1)">${ic("trash")} Delete and take that stock off again</button><button class="btn g wide red" onclick="doPuDelete('${esc(n)}',0)">Delete, but leave stock as it is</button><button class="btn g wide" onclick="closeM()">Keep it</button></div>`);
}
const doPuDelete = (n, rev) => act(async () => { await api(base + "/purchases/" + n + "?reverse=" + (rev ? 1 : 0), "DELETE"); closeM(); });

// the Purchase form (inside New invoice)
function puCalc() {
  const sub = sum(PIN.lines, l => (+l.qty || 0) * (+l.cost || 0)), disc = Math.min(Math.max(0, +PIN.discount || 0), sub), tax = sub - disc, gst = Math.round(tax * PIN.gst / 100);
  return { sub, disc, gst, total: tax + gst };
}
function puTotals() { const c = puCalc(); return `<div class="tl"><span>Subtotal</span><span>${inr(c.sub)}</span></div><div class="tl"><span>Discount</span><span>−${inr(c.disc)}</span></div><div class="tl"><span>GST ${PIN.gst}%</span><span>${inr(c.gst)}</span></div><div class="tl big"><span>Total</span><span>${inr(c.total)}</span></div>`; }
const puRecalc = () => { const t = $("ptot"); if (t) t.innerHTML = puTotals(); PIN.lines.forEach((l, i) => { const e = $("plt" + i); if (e) e.textContent = inr((+l.qty || 0) * (+l.cost || 0)); }); };
function vPurchase() {
  const st = PIN.pay.status;
  return `<div class="card"><div class="cap">Supplier</div>
    <label>Supplier<select style="width:100%;margin:5px 0 12px" onchange="PIN.supplier=this.value"><option value="">Choose a supplier</option>${S.map(s => `<option ${s.name == PIN.supplier ? "selected" : ""}>${esc(s.name)}</option>`).join("")}${PIN.supplier && !S.some(s => s.name == PIN.supplier) ? `<option selected>${esc(PIN.supplier)}</option>` : ""}</select></label>
    ${S.length ? "" : `<p class="mute" style="margin:-6px 0 10px">No suppliers yet. <button class="lnk" onclick="go('sup')">Add one under Suppliers</button></p>`}
    <div class="fg keep"><label>Bill no. (optional)<input value="${esc(PIN.billNo)}" oninput="PIN.billNo=this.value" autocomplete="off"></label><label>Date${dfield({ value: PIN.date, onchange: "PIN.date=this.value" })}</label></div></div>
  <div class="card"><div class="cap">Products bought</div>${PIN.lines.map((l, i) => `<div style="padding:10px 0;border-top:${i ? "1px solid var(--line)" : "0"}"><div class="row nw" style="justify-content:space-between"><div style="min-width:0"><b>${esc(l.name)}</b>${l.id ? "" : ' <span class="bd wn">New · saved as draft</span>'}</div><button class="circ" style="width:34px;height:34px;border:0;color:var(--mute)" onclick="puDel(${i})" aria-label="Remove ${esc(l.name)}">${ic("trash")}</button></div>
      <div class="fg keep" style="margin-top:6px"><label>Quantity<input type="number" min="1" step="1" inputmode="numeric" value="${l.qty}" oninput="PIN.lines[${i}].qty=Math.floor(+this.value)||0;puRecalc()"></label><label>Purchase price (₹)<input type="number" min="0" step="any" inputmode="decimal" value="${l.cost}" oninput="PIN.lines[${i}].cost=+this.value||0;puRecalc()"></label></div><label>Expiry of this stock (month and year, optional)${mfield({ value: l.expiry || "", onchange: `PIN.lines[${i}].expiry=this.value` })}</label><div class="mute" style="margin-top:-6px;text-align:right">Line total <b id="plt${i}" style="color:var(--ink)">${inr((+l.qty || 0) * (+l.cost || 0))}</b></div></div>`).join("") || '<p class="mute" style="margin:0">No products yet.</p>'}
    <div class="pair"><button onclick="openPuPicker()">${ic("plus")} Add product</button><button onclick="invScan('purchase')" aria-label="Scan a barcode to add a product">${ic("camera")} Scan</button></div></div>
  <div class="card"><div class="cap">Payment</div><div class="tri">${[["paid", "Paid", ""], ["partial", "Partial", "p"], ["unpaid", "Unpaid", "u"]].map(([v, l, c]) => `<button class="${st == v ? "on " + c : ""}" onclick="PIN.pay.status='${v}';draw()">${l}</button>`).join("")}</div>
    ${st != "unpaid" ? `<div class="pm">${["UPI", "Card", "Cash", "Bank"].map(m => `<button class="${PIN.pay.method == m ? "on" : ""}" onclick="PIN.pay.method='${m}';draw()">${m}</button>`).join("")}</div>` : ""}
    ${st == "partial" ? `<label style="margin-top:12px">Amount paid now (₹)<input type="number" min="1" value="${PIN.pay.amount || ""}" oninput="PIN.pay.amount=+this.value"></label>` : ""}
    <div class="fg keep" style="margin-top:14px"><label>Discount (₹)<input type="number" min="0" value="${PIN.discount || ""}" placeholder="0" oninput="PIN.discount=+this.value;puRecalc()"></label><label>GST<select style="width:100%;margin:5px 0 12px" onchange="PIN.gst=+this.value;puRecalc()">${[0, 5, 12, 18, 28].map(r => `<option value="${r}" ${PIN.gst == r ? "selected" : ""}>${r}%</option>`).join("")}</select></label></div>
    <label>Notes<input value="${esc(PIN.notes)}" placeholder="Optional note" oninput="PIN.notes=this.value"></label>
    <label class="ck" style="margin-top:2px"><input type="checkbox" ${PIN.updateCost ? "checked" : ""} onchange="PIN.updateCost=this.checked"> Update each product’s purchase price to this price</label></div>
  <div class="card" id="ptot">${puTotals()}</div>`;
}
const puDel = i => { PIN.lines.splice(i, 1); draw(); };
function openPuPicker() {
  modal(`<h2 style="font-size:1.2rem">Add product</h2><div class="srch" style="margin-bottom:10px">${ic("search")}<input id="pks" placeholder="Search, or type a new product name" oninput="renderPuPick()" autocomplete="off"></div><div id="pkl"></div>`); renderPuPick();
}
function renderPuPick() {
  const raw = ($("pks") ? $("pks").value : "").trim(), q = raw.toLowerCase(), box = $("pkl"); if (!box) return;
  const hit = P.filter(p => !q || [p.name, p.sku, p.barcode, p.o1, p.o2].join(" ").toLowerCase().includes(q)).slice(0, 40), exact = P.some(p => p.name.toLowerCase() == q);
  box.innerHTML = (raw && !exact ? `<button class="pr" style="border-style:dashed" onclick="puPickNew(this.dataset.n)" data-n="${esc(raw)}"><div class="tile" style="background:var(--soft);color:var(--ac)">${ic("plus")}</div><div class="grow"><div class="nm">Add “${esc(raw)}” as a new product</div><div class="mute">Saved as a draft. Add price and photo later.</div></div></button>` : "") +
    hit.map(p => `<button class="pr" onclick="puPick('${p.id}')">${picOf(p)}<div class="grow"><div class="nm">${esc(p.name)}</div><div class="mute">${esc(p.sku || "")}${can("cost") && p.cost != null ? " · cost " + inr(p.cost) : ""}</div></div><div class="rt"><b>${p.qty == null ? "—" : p.qty}</b><span class="mute">in stock</span></div></button>`).join("");
  if (!box.innerHTML) box.innerHTML = '<p class="mute">Type a name to add it.</p>';
}
function puPick(id) { const p = P.find(x => x.id == id), l = PIN.lines.find(x => x.id == id); if (l) l.qty++; else PIN.lines.push({ id, name: p.name, qty: 1, cost: p.cost || 0, expiry: "" }); closeM(); draw(); }
function puPickNew(name) { const l = PIN.lines.find(x => !x.id && x.name.toLowerCase() == name.toLowerCase()); if (l) l.qty++; else PIN.lines.push({ id: "", name, qty: 1, cost: 0 }); closeM(); draw(); }
function openPurDraft(id) { const d = DR.find(x => x.id == id); if (!d) return; const b = blankPur(); invKind = "purchase"; PIN = { ...b, ...d, lines: (d.lines || []).map(l => ({ ...l })), pay: { ...b.pay, ...(d.pay || {}) } }; PIN.id = id; if (!INV) INV = blankInv(); go("inv"); }
async function savePurDraft() {
  try { await api(base + "/purchase-drafts", "POST", { ...PIN, id: PIN.id || undefined }); await load(); PIN = null; invKind = "sales"; ivTab = "purchase"; alert("Draft saved. You can continue it under Inventory → Purchase."); go("inven"); }
  catch (e) { alert(e.message); }
}
async function createPurchase() {
  if (!PIN.supplier) return alert("Choose the supplier.");
  if (!PIN.lines.length) return alert("Add at least one product.");
  if (PIN.lines.some(l => !(l.qty >= 1))) return alert("Every product needs a quantity of 1 or more.");
  const c = { ...PIN };
  try {
    const r = await api(base + "/purchases", "POST", c);
    if (c.id) await api(base + "/drafts/" + c.id, "DELETE").catch(() => {});
    await load(); PIN = null; invKind = "sales"; ivTab = "purchase"; puq = ""; tab = "inven"; draw();
    modal(`<div style="text-align:center"><div class="tile" style="margin:0 auto 12px;background:var(--okb);color:var(--ok);width:56px;height:56px;border-radius:50%">${ic("check", 26)}</div><h2 style="font-size:1.25rem;margin:0">Purchase saved</h2><p class="mute">${esc(r.number)} · ${inr(r.total)}<br>Stock has been added.</p>${r.newProducts ? `<p class="mute">${r.newProducts} new product${r.newProducts == 1 ? " was" : "s were"} added as a draft. Add a selling price and photo to make ${r.newProducts == 1 ? "it" : "them"} live.</p>` : ""}</div><div class="acts"><button class="btn g grow" onclick="closeM();newInvoice('purchase')">Add another</button><button class="btn grow" onclick="closeM()">Done</button></div>`);
  } catch (e) { alert(e.message); }
}

// ----- suppliers -----
function vCus() {
  if (CUERR) return `<p class="mute">${esc(CUERR)}</p>`;
  if (!CU) return '<p class="mute">Loading customers…</p>';
  const q = cuq.trim().toLowerCase(), L = CU.filter(c => !q || (c.name + " " + c.email).toLowerCase().includes(q));
  return `<div class="card" style="display:flex;gap:18px;flex-wrap:wrap"><div><div class="mute">Customers</div><b style="font-size:1.4rem">${CU.length}</b></div><div><div class="mute">Purchase value</div><b style="font-size:1.4rem">${inr(sum(CU, c => c.value))}</b></div><div><div class="mute">Paid</div><b style="font-size:1.4rem">${inr(sum(CU, c => c.paid))}</b></div></div>
  <div class="srch" style="margin-bottom:10px">${ic("search")}<input placeholder="Search name or email" value="${esc(cuq)}" oninput="cuq=this.value;draw();const i=document.querySelector('.srch input');if(i){i.focus();i.setSelectionRange(cuq.length,cuq.length)}" autocomplete="off"></div>
  ${L.map(c => `<div class="card"><div class="row nw" style="justify-content:space-between;align-items:flex-start;gap:10px"><div style="min-width:0"><b>${esc(c.name || "No name yet")}</b><div class="mute" style="overflow-wrap:anywhere">${esc(c.email)}</div></div><span class="bd ${c.paid >= c.value && c.value > 0 ? "ok" : c.value > c.paid ? "wn" : "nt"}">${c.value > c.paid ? inr(c.value - c.paid) + " due" : c.value > 0 ? "All paid" : "No orders"}</span></div>
  <div class="fg keep" style="margin-top:10px;gap:8px"><div><div class="mute">Orders</div><b>${c.orders}</b></div><div><div class="mute">Purchase value</div><b>${inr(c.value)}</b></div><div><div class="mute">Paid</div><b>${inr(c.paid)}</b></div></div></div>`).join("") || '<p class="mute">No customers yet. They appear here when someone makes an account on your store.</p>'}`;
}
function vSup() {
  return (owner() ? `<form class="card" onsubmit="addSup(event)"><b>Add a supplier</b><div class="fg" style="margin-top:8px"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label></div>
  <label>Note (optional)<input name="note"></label><button class="btn">Add supplier</button></form>` : "") +
  (S.map(s => `<div class="card row" style="justify-content:space-between"><div><b>${esc(s.name)}</b> <span class="mute">${esc(s.phone)} ${esc(s.note)}</span><div class="mute">${P.filter(p => p.supplier == s.name).length} products</div></div>${owner() ? `<button class="btn g sm" onclick="delSup('${s.id}')">Delete</button>` : ""}</div>`).join("") || '<p class="mute">No suppliers yet.</p>');
}
function addSup(e) { e.preventDefault(); const b = Object.fromEntries(new FormData(e.target)); act(() => api(base + "/suppliers", "POST", b)); }
function delSup(id) { if (confirm("Delete this supplier? Products keep the name.")) act(() => api(base + "/suppliers/" + id, "DELETE")); }

// ----- tags (owner) -----
function vTag() {
  return `<form class="card" onsubmit="addTag(event)"><b>Add a tag</b><p class="mute">Each tag becomes a section on your online store, like “Bestsellers” or “Snacks”. Products with no tag appear under “More items”. Staff can put products into tags, but only you can create them.</p>
  <div class="row" style="flex-wrap:nowrap"><input name="name" placeholder="e.g. Bestsellers" required maxlength="30" style="margin:0"><button class="btn">Add</button></div></form>` +
  (T.map((t, i) => `<div class="card row" style="justify-content:space-between"><div><b>${esc(t.name)}</b><div class="mute">${P.filter(p => (p.tags || []).includes(t.name)).length} products</div></div>
   <div class="row"><button class="btn g sm" ${i ? "" : "disabled"} onclick="moveTag('${t.id}','up')" aria-label="Move up">↑</button><button class="btn g sm" ${i < T.length - 1 ? "" : "disabled"} onclick="moveTag('${t.id}','down')" aria-label="Move down">↓</button><button class="btn g sm" onclick="delTag('${t.id}')">Delete</button></div></div>`).join("") || '<p class="mute">No tags yet.</p>');
}
function addTag(e) { e.preventDefault(); const n = e.target.elements.name.value; act(() => api(base + "/tags", "POST", { name: n })); }
const moveTag = (id, dir) => act(() => api(base + "/tags/" + id + "/move", "POST", { dir }));
function delTag(id) { if (confirm("Delete this tag? Products keep existing but lose the tag.")) act(() => api(base + "/tags/" + id, "DELETE")); }

// ----- staff (owner) -----
function vUsr() {
  return `<div class="card"><button class="btn" onclick="openStaff()">+ Add a staff member</button><p class="mute" style="margin:8px 0 0">Staff log in on the same page as you, using their username. Only you can set selling prices and make products live.</p></div>` +
  (U.map(u => `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(u.name)}</b> <span class="mute">@${esc(u.username)}</span></div><label class="sw" title="Allowed to log in"><input type="checkbox" ${u.active ? "checked" : ""} onchange="staffOn('${esc(u.username)}',this.checked)" aria-label="Can log in"><i></i></label></div>
   <div style="margin:6px 0">${Object.keys(PL).filter(k => u.perms[k]).map(k => `<span class="chip">${esc(PL[k])}${k == "orders" ? " (" + (u.perms.orderView || []).map(x => DL[x]).join(", ") + ")" : ""}</span>`).join("") || '<span class="mute">No permissions yet</span>'}</div>
   <div class="acts" style="margin:0"><button class="btn g sm" onclick="openStaff('${esc(u.username)}')">Permissions</button><button class="btn g sm" onclick="staffPw('${esc(u.username)}')">New password</button><button class="btn g sm" onclick="delStaff('${esc(u.username)}')">Delete</button></div></div>`).join("") || '<p class="mute">No staff yet.</p>');
}
function openStaff(un) {
  const u = U.find(x => x.username == un) || { perms: { add: true, stock: true, cost: true, tags: true, orders: false } };
  modal(`<form onsubmit="saveStaff(event,'${un || ""}')"><h2>${un ? "Permissions for " + esc(u.name) : "Add a staff member"}</h2>
  ${un ? "" : '<label>Name<input name="name" required></label><label>Username (they type this to log in)<input name="username" required pattern="[a-z0-9._-]{3,30}" autocapitalize="none"></label><label>Password (6+ characters)<input name="password" type="text" minlength="6" required></label>'}
  <label>What can they do?</label>${Object.keys(PL).map(k => `<label class="ck" style="margin:6px 0"><input type="checkbox" name="${k}" ${u.perms[k] ? "checked" : ""}> ${esc(PL[k])}</label>`).join("")}
  <label style="margin-top:8px">Which orders can they see? (only matters if “View and update orders” is ticked)</label>${Object.keys(DL).map(k => `<label class="ck" style="margin:4px 0"><input type="checkbox" name="ov_${k}" ${(u.perms.orderView || ["New", "Packed"]).includes(k) ? "checked" : ""}> ${DL[k]}</label>`).join("")}
  <p class="mute">Staff only get the delivery dropdown on orders. They never see prices, payments or invoices, and only you can cancel an order or change selling prices.</p>
  <div class="acts"><button type="button" class="btn g" onclick="closeM()">Cancel</button><button class="btn">Save</button></div></form>`);
}
function saveStaff(e, un) {
  e.preventDefault(); const f = e.target.elements, perms = Object.fromEntries(Object.keys(PL).map(k => [k, f[k].checked]));
  perms.orderView = Object.keys(DL).filter(k => e.target.querySelector(`[name="ov_${k}"]`).checked);
  act(async () => { if (un) await api(base + "/users/" + un, "PATCH", { perms }); else await api(base + "/users", "POST", { name: f.name.value, username: f.username.value.toLowerCase(), password: f.password.value, perms }); closeM(); });
}
const staffOn = (un, on) => act(() => api(base + "/users/" + un, "PATCH", { active: on }));
function staffPw(un) { const pw = prompt("New password for " + un + " (6+ characters)"); if (pw) act(() => api(base + "/users/" + un, "PATCH", { password: pw })); }
function delStaff(un) { if (confirm("Delete " + un + "? They will no longer be able to log in.")) act(() => api(base + "/users/" + un, "DELETE")); }

</script>
</body>
</html>
